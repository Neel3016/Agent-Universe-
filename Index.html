<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Universe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="agent-details">
            <h2>Create Agent</h2>
            <form id="agentForm">
                <input type="text" id="agentName" placeholder="Agent Name" required>
                <input type="text" id="agentRole" placeholder="Agent Role" required>
                <textarea id="agentDescription" placeholder="Agent Description" required></textarea>
                <button type="submit">Create Agent</button>
            </form>
        </div>
        <div class="agent-list">
            <h2>Agent List</h2>
            <ul id="agentList">
                <!-- Agent names will appear here -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
